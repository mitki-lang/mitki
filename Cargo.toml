[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)'] }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
mem_forget = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_value = "warn"
single_match_else = "warn"
unused_self = "warn"
unused_trait_names = "warn"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
camino = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mitki-abi-lower = { path = "crates/mitki-abi-lower" }
mitki-abi = { path = "crates/mitki-abi" }
mitki-analysis = { path = "crates/mitki-analysis" }
mitki-backend-wasm = { path = "crates/mitki-backend-wasm" }
mitki-codegen-core = { path = "crates/mitki-codegen-core" }
mitki-comptime-wasm = { path = "crates/mitki-comptime-wasm" }
mitki-db = { path = "crates/mitki-db" }
mitki-errors = { path = "crates/mitki-errors" }
mitki-hir = { path = "crates/mitki-hir" }
mitki-ide = { path = "crates/mitki-ide" }
mitki-inputs = { path = "crates/mitki-inputs" }
mitki-lsp-server = { path = "crates/mitki-lsp-server" }
mitki-lower = { path = "crates/mitki-lower" }
mitki-parse = { path = "crates/mitki-parse" }
mitki-resolve = { path = "crates/mitki-resolve" }
mitki-span = { path = "crates/mitki-span" }
mitki-typeck = { path = "crates/mitki-typeck" }
mitki-tokenizer = { path = "crates/mitki-tokenizer" }
mitki-wasm-runtime = { path = "crates/mitki-wasm-runtime" }
mitki-yellow = { path = "crates/mitki-yellow" }
salsa = { version = "0.26", default-features = false, features = [
    "macros",
    "inventory",
] }
rustc-hash = "2.0"
text-size = "1.1"
wasm-encoder = "0.245.1"
wasmparser = "0.245.1"
wasmtime = "42.0.1"
wasmtime-wasi = "42.0.1"
